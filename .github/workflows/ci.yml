name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: mvt
          POSTGRES_PASSWORD: mvt
          POSTGRES_DB: mvt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mvt -d mvt" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r platform/requirements-dev.txt -r simulator/requirements-dev.txt -r edge/requirements-dev.txt
      - name: Tests del simulador
        run: cd simulator && python -m pytest -q
      - name: Tests del edge (visión; YOLO se saltea sin ultralytics)
        run: cd edge && python -m pytest -q -rs
      - name: Tests de la plataforma (SQLite + TimescaleDB)
        env:
          MVT_TEST_PG_URL: postgresql+psycopg://mvt:mvt@localhost:5432/mvt
        run: cd platform && python -m pytest -q
      - name: Migraciones contra PostgreSQL (upgrade, drift check, seed)
        env:
          MVT_DATABASE_URL: postgresql+psycopg://mvt:mvt@localhost:5432/mvt
        run: |
          cd platform
          alembic upgrade head
          alembic check
          python -m mvtwin.seed
          python -m mvtwin.seed

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
